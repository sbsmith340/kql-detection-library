detection: identity/password-spray-entra.yaml
cases:
  - name: one IP fails against twelve accounts
    expect: hit
    tables:
      SigninLogs:
        - {TimeGenerated: -30m, UserPrincipalName: "user{i}@contoso.com", ResultType: "50126", IPAddress: 203.0.113.200, LocationDetails: {countryOrRegion: RU}, AppDisplayName: Azure Portal, _repeat: 12}
  - name: one IP fails against five accounts
    expect: miss
    tables:
      SigninLogs:
        - {TimeGenerated: -30m, UserPrincipalName: "user{i}@contoso.com", ResultType: "50126", IPAddress: 203.0.113.200, LocationDetails: {countryOrRegion: RU}, AppDisplayName: Azure Portal, _repeat: 5}
  - name: twelve failures from twelve different IPs
    expect: miss
    tables:
      SigninLogs:
        - {TimeGenerated: -30m, UserPrincipalName: "user{i}@contoso.com", ResultType: "50126", IPAddress: "198.51.100.{i}", LocationDetails: {countryOrRegion: US}, _repeat: 12}

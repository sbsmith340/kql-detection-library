id: 3f1c2a10-6b1e-4c7a-9a01-0c5f1e7d2a01
name: Password spray against Entra ID
description: >
  One source IP fails sign-in for many distinct accounts in a short window using
  bad-password errors. Classic low-and-slow spray pattern.
severity: Medium
status: emulator-tested
tactics: [CredentialAccess]
techniques: [T1110.003]
data_sources: [SigninLogs]
query_frequency: PT1H
query_period: PT1H
trigger_threshold: 0
query: |
  let window = 1h;
  let minAccounts = 10;
  // 50126 = invalid username or password, 50053 = account locked (smart lockout)
  SigninLogs
  | where TimeGenerated > ago(window)
  | where ResultType in ("50126", "50053")
  | summarize FailedAccounts = dcount(UserPrincipalName),
              Attempts = count(),
              SampleUsers = make_set(UserPrincipalName, 10),
              Apps = make_set(AppDisplayName, 5),
              FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)
      by IPAddress, Location = tostring(LocationDetails.countryOrRegion)
  | where FailedAccounts >= minAccounts
  | order by FailedAccounts desc
entity_mappings:
  - entityType: IP
    fieldMappings: [{identifier: Address, columnName: IPAddress}]
tuning: >
  Exclude known egress IPs of your own VPN/proxy if users share them, or raise
  minAccounts. Pair with a follow-up for any success (ResultType 0) from the
  same IP in the next hour.
false_positives: Misconfigured service or SSO broker replaying stale credentials for many users.
test: >
  From a lab VM, attempt sign-in to 12 test accounts with a wrong password
  within 10 minutes. The IP should appear with FailedAccounts >= 12.
